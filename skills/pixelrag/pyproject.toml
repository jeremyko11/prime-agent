[project]
name = "pixelrag-skill"
version = "1.0.0"
description = "Visual RAG skill for Prime Agent - screenshot and search by visual content"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
