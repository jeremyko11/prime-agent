[project]
name = "prime-agent-skill-read-page"
version = "0.1.0"
description = "Single-page deep reading with backend fallback, source grading, caching."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_page"]
